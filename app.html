<!-- ======================================================= --> 
<!-- INICIO DE LA VALIDACIÓN DE LICENCIA (INSERTADO)         --> 
<!-- ======================================================= --> 
<div *ngIf="isLicensed"> 
<!-- PANTALLA DE CARGA 3D (SPLASH SCREEN CON VIDEO) --> 
<div *ngIf="cargandoSplash" style="position: fixed; top: 0; left: 0; width: 100vw; height: 
100vh; background-color: #0f172a; display: flex; flex-direction: column; justify-content: 
center; align-items: center; z-index: 99999;"> 
<video autoplay muted playsinline style="width: 100%; max-width: 400px; height: auto; 
object-fit: contain;"> 
<source src="megafutbol.mp4" type="video/mp4"> 
Tu navegador no soporta la reproducción de videos. 
</video> 
</div> 
<div class="container" style="padding: 15px; max-width: 600px; margin: 0 auto; font-family: sans-serif;"> 
<!-- TÍTULO PRINCIPAL Y SUBTÍTULO --> 
<div style="text-align: center; margin-bottom: 15px;"> 
<h1 style="color: #38bdf8; margin-bottom: 5px; font-size: 1.8rem;">MEGAFÚTBOL</h1> 
<p style="color: #94a3b8; font-size: 0.9rem; margin: 0;">Sistema integral automatizado 
de análisis y predicción deportiva</p> 
</div> 
<div style="margin-bottom: 20px; background: #1e293b; padding: 12px; border-radius: 
8px; border: 2px dashed #38bdf8;"> 
<div style="display: flex; justify-content: space-between; margin-bottom: 6px;"> 
      <label style="color: #38bdf8; font-size: 0.9rem; font-weight: bold;">Autocompletar 
Estadísticas</label> 
      <span style="font-size: 0.75rem; color: #94a3b8;">Pega aquí el texto de la IA</span> 
    </div> 
    <textarea 
      [(ngModel)]="textoPegadoUsuario" 
      (input)="procesarTextoPegado()" 
      placeholder="Pega el bloque de texto aquí y los campos se llenarán solos..." 
      rows="2" 
      style="width: 100%; background: #0f172a; color: white; border: 1px solid #475569; 
padding: 8px; border-radius: 4px; font-size: 0.85rem; resize: none; box-sizing: border
box;"> 
    </textarea> 
  </div> 
 
  <!-- 2. CAMPOS DE ENTRADA (FORMULARIO MANUAL) --> 
  <div style="background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 
20px; color: white;"> 
    <h3 style="color: #f8fafc; font-size: 0.95rem; margin-top: 0; margin-bottom: 
12px;">Parámetros del Partido</h3> 
     
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 
10px;"> 
      <div> 
        <label style="font-size: 0.75rem; color: #94a3b8; display: block;">Goles Favor 
Local</label> 
        <input type="number" [(ngModel)]="inputData.golesFavorLocal" 
(ngModelChange)="recalcular()" style="width: 100%; padding: 8px; background: #0f172a; 
border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box;"> 
      </div> 
      <div> 
        <label style="font-size: 0.75rem; color: #94a3b8; display: block;">Goles en Contra 
Local</label> 
        <input type="number" [(ngModel)]="inputData.golesEnContraLocal" 
(ngModelChange)="recalcular()" style="width: 100%; padding: 8px; background: #0f172a; 
border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box;"> 
      </div> 
    </div> 
 
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 
10px;"> 
      <div> 
        <label style="font-size: 0.75rem; color: #94a3b8; display: block;">Goles Favor 
Visita</label> 
        <input type="number" [(ngModel)]="inputData.golesFavorVisita" 
(ngModelChange)="recalcular()" style="width: 100%; padding: 8px; background: #0f172a; 
border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box;"> 
      </div> 
      <div> 
        <label style="font-size: 0.75rem; color: #94a3b8; display: block;">Goles en Contra 
Visita</label> 
        <input type="number" [(ngModel)]="inputData.golesEnContraVisita" 
(ngModelChange)="recalcular()" style="width: 100%; padding: 8px; background: #0f172a; 
border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box;"> 
      </div> 
    </div> 
 
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 
10px;"> 
      <div> 
        <label style="font-size: 0.75rem; color: #94a3b8; display: block;">Prom. Goles Part. 
Local</label> 
        <input type="number" step="0.1" [(ngModel)]="inputData.promGolesPartidoLocal" 
(ngModelChange)="recalcular()" style="width: 100%; padding: 8px; background: #0f172a; 
border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box;"> 
      </div> 
      <div> 
        <label style="font-size: 0.75rem; color: #94a3b8; display: block;">Prom. Goles Part. 
Visita</label> 
        <input type="number" step="0.1" [(ngModel)]="inputData.promGolesPartidoVisita" 
(ngModelChange)="recalcular()" style="width: 100%; padding: 8px; background: #0f172a; 
border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box;"> 
      </div> 
    </div> 
 
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 
10px;"> 
      <div> 
        <label style="font-size: 0.75rem; color: #94a3b8; display: block;">Tarjetas 
Promedio</label> 
        <input type="number" step="0.1" [(ngModel)]="inputData.tarjetasPromedio" 
(ngModelChange)="recalcular()" style="width: 100%; padding: 8px; background: #0f172a; 
border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box;"> 
      </div> 
      <div> 
        <label style="font-size: 0.75rem; color: #94a3b8; display: block;">Córners 
Promedio</label> 
        <input type="number" step="0.1" [(ngModel)]="inputData.cornersPromedio" 
(ngModelChange)="recalcular()" style="width: 100%; padding: 8px; background: #0f172a; 
border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box;"> 
      </div> 
    </div> 
 
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"> 
      <div> 
        <label style="font-size: 0.75rem; color: #94a3b8; display: block;">Casa de 
Apuestas</label> 
        <input type="text" [(ngModel)]="inputData.casaApuestas" 
(ngModelChange)="recalcular()" placeholder="Ej. Wplay" style="width: 100%; padding: 
8px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; 
box-sizing: border-box;"> 
      </div> 
      <div> 
        <label style="font-size: 0.75rem; color: #94a3b8; display: block;">Cuota 
Ofrecida</label> 
        <input type="number" step="0.01" [(ngModel)]="inputData.cuotaOfrecida" 
(ngModelChange)="recalcular()" style="width: 100%; padding: 8px; background: #0f172a; 
border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box;"> 
      </div> 
    </div> 
  </div> 
 
  <!-- 3. PANTALLA DE RESULTADOS Y DESGLOSE --> 
  <div style="background: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 10px; margin-bottom: 20px; color: white;"> 
<h3 style="color: #38bdf8; font-size: 0.95rem; margin-top: 0; text-align: center; margin-bottom: 15px;">Resultado de Análisis</h3> 
<!-- Aquí se inyectan dinámicamente las tarjetas estilizadas desde el TypeScript --> 
<div [innerHTML]="analisisNarrativo"></div> 
</div> 
</div> 
<!-- 5. BOTÓN DE IMPRESIÓN / DESCARGA PDF NATIVA --> 
<button (click)="descargarReportePDF()" style="width: 100%; background: #10b981; 
color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: 
pointer; font-size: 0.9rem; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);"> 
☑ Imprimir / Descargar Reporte PDF 
</button> 
</div> 
<!-- ======================================================= --> 
<!-- CIERRE DE LICENCIA Y PANTALLA DE BLOQUEO (INSERTADO)    --> 
<!-- ======================================================= --> 
</div> 
<div *ngIf="!isLicensed" style="display: flex; justify-content: center; align-items: center; 
height: 100vh; background: #0f172a; color: white; font-family: sans-serif;"> 
<div style="background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 
10px 25px rgba(0,0,0,0.5); width: 350px; text-align: center;"> 
<h2>MegaFútbol - Activación</h2> 
<p style="font-size: 14px; color: #94a3b8; margin-bottom: 20px;">Ingrese su clave 
genérica (202601) o la clave maestra (Milena1428).</p> 
<input type="password" [(ngModel)]="inputKey" placeholder="Ingrese su clave" 
style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: 1px 
solid #475569; background: #0f172a; color: white; box-sizing: border-box;"> 
<button (click)="activarLicencia()" style="width: 100%; padding: 10px; background: 
#2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: 
pointer;">Activar Licencia</button> 
<p *ngIf="mensajeEstado" style="color: #38bdf8; font-size: 13px; margin-top: 15px;">{{ 
mensajeEstado }}</p> 
</div> 
</div>
