<div class="login-container" style="max-width: 400px; margin: 50px auto; padding: 20px; text-align: center; background: #1e293b; color: #fff; border-radius: 8px;">
  <h2>MEGAFUTBOL</h2>
  <p>Iniciar Sesión</p>

  <div style="margin-bottom: 15px; text-align: left;">
    <label style="display: block; margin-bottom: 5px;">Usuario:</label>
    <input type="text" [(ngModel)]="usuarioInput" placeholder="Ingresa tu usuario" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff;">
  </div>

  <div style="margin-bottom: 20px; text-align: left;">
    <label style="display: block; margin-bottom: 5px;">Contraseña:</label>
    <input type="password" [(ngModel)]="passwordInput" placeholder="Ingresa tu contraseña" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff;">
  </div>

  <button (click)="onLogin()" style="width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
    Ingresar
  </button>
</div>
